# GitHub disables scheduled workflows in a repository after 60 days with no
# activity, and a scheduled run does not itself count as activity. This makes
# one tiny commit a week so the restock schedule is never silently switched off.
name: Keep schedule alive

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit a heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-heartbeat.txt
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "chore: keep scheduled workflows alive [skip ci]"
          git push
